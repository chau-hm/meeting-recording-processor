[project]
name = "meeting-recording-processor"
version = "0.1.0"
description = "Local-first Cantonese meeting transcription for Apple Silicon"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "mlx-qwen3-asr==0.3.5",
  "mlx-audio==0.4.1",
  "huggingface-hub>=0.30,<2",
  "opencc-python-reimplemented==0.1.7",
  "torch>=2.6,<3",
  "transformers>=5.3.0,<5.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
meeting-recording-processor = "meeting_recording_processor.cli:entrypoint"
mrp = "meeting_recording_processor.cli:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_recording_processor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
